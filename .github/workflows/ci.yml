name: wzryagnt-ci

on:
  push:
  pull_request:

jobs:
  config-and-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libs for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Safety and config gates
        run: |
          python -X utf8 scripts/validate_safety.py
          python -X utf8 scripts/validate_configs.py
      - name: Core regression
        run: python -X utf8 scripts/run_tests.py --only protocols --only official --only safety --only behavior
